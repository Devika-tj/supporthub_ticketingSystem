{% extends 'base.html' %}


{% block title %}
Change Password - SupportHub
{% endblock %}


{% block content %}


<div class="container py-5">


    <div class="form-card narrow-card">


        <h2>
            Change Password
        </h2>


        <p class="text-muted">
            Update the password provided by the administrator.
        </p>


        <form method="post">

            {% csrf_token %}


            {{ form.as_p }}


            <button class="btn btn-primary">
                Change Password
            </button>


            <a
                class="btn btn-light"
                href="{% url 'staff_portal:profile' %}"
            >
                Cancel
            </a>


        </form>


    </div>

</div>

{% endblock %}
